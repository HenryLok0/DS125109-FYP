<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>泊易香港</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="onestop.css">
</head>
<body>
    <header class="pages-bar">
        <strong>泊易香港</strong>
        <nav>
            <button type="button" id="lang-zh">繁</button>
            <button type="button" id="lang-en">EN</button>
            <button type="button" id="pages-theme">Theme</button>
        </nav>
    </header>
    <main class="pages-wrap onestop-page">
        <h1 id="page-title">一站式泊車空位</h1>
        <p class="onestop-note" id="page-note">停車場空位、咪錶位置同交通快拍喺同一張圖。咪錶只有位置，沒有即時空位。顏色是而家所選車種的空位。</p>
        <div id="onestop-root" data-history="data/history.json">
            <div class="onestop-filters">
                <label>車種
                    <select id="vehicle-filter">
                        <option value="privateCar">私家車</option>
                        <option value="motorCycle">電單車</option>
                    </select>
                </label>
                <label><input type="checkbox" id="filter-open"> 只顯示營業中</label>
                <label><input type="checkbox" id="filter-space"> 只顯示有位</label>
                <label>地區
                    <select id="district-filter">
                        <option value="">全部地區</option>
                    </select>
                </label>
            </div>
            <div class="onestop-layers">
                <label><input type="checkbox" id="layer-parks" checked disabled> 停車場</label>
                <label><input type="checkbox" id="layer-meters"> 咪錶位置</label>
                <label><input type="checkbox" id="layer-cameras"> 交通快拍</label>
            </div>
            <p id="filter-empty" class="onestop-note" hidden>這個篩選冇場。可以取消「有位」或「營業中」。</p>
            <div class="onestop-layout">
                <div id="onestop-map"></div>
                <aside class="onestop-side">
                    <h2 id="notice-title">地區通告</h2>
                    <div id="notice-list">點一個停車場，或先選地區。</div>
                </aside>
            </div>
            <div class="onestop-legend">
                <span class="legend-many">50 個或以上</span>
                <span class="legend-some">10 至 49 個</span>
                <span class="legend-few">少於 10 個</span>
                <span class="legend-meter">咪錶</span>
                <span class="legend-camera">快拍</span>
            </div>
            <section class="onestop-chat">
                <h2>泊車助手</h2>
                <p class="onestop-note">用同一套篩選：車種、營業中、有位。例如：中環今日私家車同電單車有位</p>
                <input id="onestop-question" type="text" placeholder="例如：中環今日私家車同電單車">
                <button type="button" id="onestop-ask">查詢</button>
                <div id="onestop-answer"></div>
            </section>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="advisor.js"></script>
    <script>
        (function () {
            var saved = localStorage.getItem("easepark-lang") || "zh";
            var root = document.getElementById("onestop-root");
            root.dataset.lang = saved;
            if (localStorage.getItem("darkMode") === "enabled") document.body.classList.add("dark-mode");
            document.getElementById("lang-zh").addEventListener("click", function () {
                localStorage.setItem("easepark-lang", "zh");
                location.reload();
            });
            document.getElementById("lang-en").addEventListener("click", function () {
                localStorage.setItem("easepark-lang", "en");
                location.reload();
            });
            document.getElementById("pages-theme").addEventListener("click", function () {
                var dark = !document.body.classList.contains("dark-mode");
                document.body.classList.toggle("dark-mode", dark);
                localStorage.setItem("darkMode", dark ? "enabled" : "disabled");
            });
            var select = document.getElementById("district-filter");
            var chinese = saved !== "en";
            if (!chinese) {
                document.documentElement.lang = "en";
                document.title = "EaseParkHK";
                document.getElementById("page-title").textContent = "One-stop parking vacancy";
                document.getElementById("page-note").textContent = "Car parks, meter locations, and traffic cameras on one map. Meters show location only, not live spaces. Colour is the selected vehicle's vacancy.";
                document.querySelector("label").firstChild.textContent = "Vehicle ";
                document.querySelector("#vehicle-filter option[value=privateCar]").textContent = "Private car";
                document.querySelector("#vehicle-filter option[value=motorCycle]").textContent = "Motorcycle";
                document.getElementById("filter-open").parentNode.lastChild.textContent = " Open only";
                document.getElementById("filter-space").parentNode.lastChild.textContent = " With a space";
                document.getElementById("district-filter").parentNode.firstChild.textContent = "District ";
                select.options[0].textContent = "All districts";
                document.getElementById("layer-parks").parentNode.lastChild.textContent = " Car parks";
                document.getElementById("layer-meters").parentNode.lastChild.textContent = " Meter locations";
                document.getElementById("layer-cameras").parentNode.lastChild.textContent = " Cameras";
                document.getElementById("filter-empty").textContent = "Nothing matches. Turn off open-only or with-a-space.";
                document.querySelector(".onestop-chat h2").textContent = "Parking assistant";
                document.querySelector(".onestop-chat .onestop-note").textContent = "Uses the same filters: vehicle, open, and a space. Example: Central private car and motorcycle.";
                document.getElementById("onestop-question").placeholder = "Example: Central private car today";
                document.getElementById("onestop-ask").textContent = "Ask";
                document.querySelector(".legend-many").textContent = "50 or more";
                document.querySelector(".legend-some").textContent = "10 to 49";
                document.querySelector(".legend-few").textContent = "Under 10";
                document.querySelector(".legend-meter").textContent = "Meter";
                document.querySelector(".legend-camera").textContent = "Camera";
            }
        })();
    </script>
    <script src="onestop.js"></script>
</body>
</html>
