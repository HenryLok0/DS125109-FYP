<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EaseParkHK 泊易香港</title>
  <meta name="description" content="EaseParkHK 泊易香港：香港停車場空位、咪錶、交通快拍、通告、分析與預測。">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-view="map">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#map">
      <img src="favicon.svg" width="40" height="40" alt="">
      <span>
        <strong>EaseParkHK</strong>
        <small id="brand-sub">泊易香港</small>
      </span>
    </a>
    <div id="kpis" class="kpis"></div>
    <div class="tools">
      <button type="button" data-action="lang" id="lang-btn">EN</button>
      <button type="button" data-action="theme" id="theme-btn"></button>
      <button type="button" data-action="refresh" id="refresh-btn"></button>
    </div>
  </header>
  <nav id="nav" class="nav"></nav>
  <div id="banner" class="banner"></div>
  <p id="status" class="status" role="status"></p>
  <main id="main">
    <section id="view-map" data-view="map">
      <div id="map"></div>
      <button type="button" class="fab" data-action="toggle-filters" id="filter-fab"></button>
      <aside id="filters" class="card filters"></aside>
      <aside id="detail" class="card detail" hidden></aside>
    </section>
    <section data-view="list" hidden><div class="page" id="list-root"></div></section>
    <section data-view="analytics" hidden><div class="page" id="analytics-root"></div></section>
    <section data-view="forecast" hidden><div class="page" id="forecast-root"></div></section>
    <section data-view="meters" hidden><div class="page" id="meters-root"></div></section>
    <section data-view="cameras" hidden><div class="page" id="cameras-root"></div></section>
    <section data-view="notices" hidden><div class="page" id="notices-root"></div></section>
    <section data-view="assistant" hidden><div class="page" id="assistant-root"></div></section>
    <section data-view="about" hidden><div class="page" id="about-root"></div></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
